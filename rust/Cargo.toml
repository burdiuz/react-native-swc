[package]
name = "actualwave_swc"
version = "0.1.0"
edition = "2021"
description = "JSON-in / JSON-out SWC wrapper used by @actualwave/react-native-swc"
license = "MIT"
publish = false # shipped inside the npm package, never to crates.io

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
swc_core = { version = "82", features = ["base_module", "ecma_ast", "ecma_parser", "ecma_transforms", "ecma_codegen", "ecma_helpers_inline", "common", "ecma_transforms_module", "ecma_transforms_compat", "ecma_transforms_typescript", "ecma_transforms_react", "ecma_utils", "ecma_visit", "ecma_minifier", "ecma_ast_serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Same version swc_core already pulls in; named here only for `TWithDiagnosticArray` (structured diagnostics).
swc_error_reporters = "28"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
